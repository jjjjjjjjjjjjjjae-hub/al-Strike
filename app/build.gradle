plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.alstrike.app'
    compileSdk 35

    defaultConfig {
        applicationId 'kz.alstrike.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
