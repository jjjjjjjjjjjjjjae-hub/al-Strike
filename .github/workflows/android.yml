name: Build al-Strike APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore character model
        run: |
          mkdir -p app/src/main/assets/models
          cat model-parts/part-*.bin > app/src/main/assets/models/ALMAS_Animations_1_2_LIGHT.glb
          test "$(wc -c < app/src/main/assets/models/ALMAS_Animations_1_2_LIGHT.glb)" -eq 33930748
          echo '5800b069b8000e69bcccc4a1f4e9466c14d175ca39d1da7ad4e91f3d4dd5ae4b  app/src/main/assets/models/ALMAS_Animations_1_2_LIGHT.glb' | sha256sum -c -
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: al-Strike-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
